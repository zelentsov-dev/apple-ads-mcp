name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Validate release ref
        id: version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          PLUGIN_VERSION="$(jq --raw-output '.version' .codex-plugin/plugin.json)"
          test "$GITHUB_REF_NAME" = "v${PLUGIN_VERSION}"
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go run github.com/zricethezav/gitleaks/v8@v8.29.1 dir --no-banner --redact .
      - run: go run github.com/goreleaser/goreleaser/v2@v2.17.1 check
      - run: python3 scripts/validate_distribution.py

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render Homebrew formula
        shell: bash
        run: |
          python3 scripts/render_homebrew_formula.py "${{ needs.verify.outputs.version }}" dist/checksums.txt dist/apple-ads-mcp.rb
          ruby -c dist/apple-ads-mcp.rb
          gh release upload "$GITHUB_REF_NAME" dist/apple-ads-mcp.rb --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/zelentsov-dev/apple-ads-mcp
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
      - name: Resolve release version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  homebrew:
    needs: [verify, binaries]
    runs-on: macos-15
    environment: release
    permissions:
      contents: read
    steps:
      - name: Download release formula
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/homebrew"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern apple-ads-mcp.rb \
            --dir "$RUNNER_TEMP/homebrew"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify formula in the tap
        shell: bash
        run: |
          FORMULA="$RUNNER_TEMP/homebrew/apple-ads-mcp.rb"
          ruby -c "$FORMULA"
          brew tap zelentsov-dev/tap
          TAP_REPOSITORY="$(brew --repository zelentsov-dev/tap)"
          cp "$FORMULA" "$TAP_REPOSITORY/Formula/apple-ads-mcp.rb"
          brew trust --formula zelentsov-dev/tap/apple-ads-mcp
          test "$(brew info --json=v2 zelentsov-dev/tap/apple-ads-mcp | jq --raw-output '.formulae[0].versions.stable')" = "${{ needs.verify.outputs.version }}"
          brew style zelentsov-dev/tap/apple-ads-mcp
          brew audit --strict --online zelentsov-dev/tap/apple-ads-mcp
          brew install --formula "$TAP_REPOSITORY/Formula/apple-ads-mcp.rb"
          brew test zelentsov-dev/tap/apple-ads-mcp
          test "$("$(brew --prefix)/bin/apple-ads-mcp" version)" = "${{ needs.verify.outputs.version }}"
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish formula to the tap
        shell: bash
        run: |
          FORMULA="$RUNNER_TEMP/homebrew/apple-ads-mcp.rb"
          API_PATH="repos/zelentsov-dev/homebrew-tap/contents/Formula/apple-ads-mcp.rb"
          CURRENT_SHA="$(gh api "$API_PATH" --jq .sha)"
          gh api "$API_PATH" --jq .content | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/current-formula.rb"
          if cmp -s "$FORMULA" "$RUNNER_TEMP/current-formula.rb"; then
            exit 0
          fi
          jq -n \
            --arg message "apple-ads-mcp ${{ needs.verify.outputs.version }}" \
            --arg content "$(base64 < "$FORMULA" | tr -d '\n')" \
            --arg sha "$CURRENT_SHA" \
            '{message: $message, content: $content, sha: $sha, branch: "main"}' \
            > "$RUNNER_TEMP/homebrew-update.json"
          gh api --method PUT "$API_PATH" --input "$RUNNER_TEMP/homebrew-update.json"
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  registry:
    needs: [verify, binaries, container, homebrew]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/registry-publish.yml
    with:
      version: ${{ needs.verify.outputs.version }}
