version: 2

builds:
  - id: apple-ads-mcp
    main: ./cmd/apple-ads-mcp
    binary: apple-ads-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/zelentsov-dev/apple-ads-mcp/internal/mcpserver.Version={{.Version}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - accounts.example.json
      - .mcp.json
      - .codex-plugin/plugin.json
      - skills/apple-ads-operator/**
      - docs/**
      - api-contract/**

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  name_template: "{{ .Tag }}"
  mode: replace
  make_latest: true
  header: |
    Apple Ads MCP {{ .Tag }} is a corrective safety release for the local-first App Store campaign operator built on Apple Ads Platform API v1.

    It adds crash-durable optimization intent storage, restart-safe receipt reconciliation, reconciliation-aware cooldowns, strict handling of partially empty report metrics, an independent mandatory `maxBid`, and direct-ID create verification. Ambiguous creates without an Apple-returned ID remain inconclusive. Policies with bid changes must be migrated to include a positive currency-matched `maxBid`.

    Existing v0.2.1 and v0.3 tool names remain available. The server remains read-only by default, has no scheduler, never retries ambiguous mutations, keeps billing PII local, and never exposes a raw HTTP passthrough. Known upstream errors from phrase/category suggestions and impression share remain visible as structured Apple errors and are not reported as successful responses.
  footer: |
    Archives include SHA-256 checksums and SPDX SBOMs. See the README for installation, Apple Ads onboarding, safety controls, and known platform behavior.

    This project is independent and is not affiliated with, endorsed by, or sponsored by Apple Inc.
