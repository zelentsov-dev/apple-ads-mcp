version: 2

builds:
  - id: apple-ads-mcp
    main: ./cmd/apple-ads-mcp
    binary: apple-ads-mcp
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/zelentsov-dev/apple-ads-mcp/internal/mcpserver.Version={{.Version}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}_{{ .Version }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - accounts.example.json
      - .mcp.json
      - .codex-plugin/plugin.json
      - skills/apple-ads-operator/**
      - docs/MIGRATION-*.md
      - docs/ROADMAP.md
      - api-contract/**

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  name_template: "{{ .Tag }}"
  mode: replace
  make_latest: true
  header: |
    Apple Ads MCP {{ .Tag }} aligns campaign and ad-group bid-strategy contracts with live Apple Ads Platform API v1 behavior: campaign MANUAL_CPT + TAP forbids bidStrategy.bid (TargetCpa must be null), campaign MAX_CONVERSIONS + INSTALL requires a positive bidStrategy.bid (TargetCpa), and ad-group MANUAL_CPT + TAP creation requires a positive default Max CPT bid.

    Switching an existing campaign to MANUAL_CPT now explicitly sends "bid": null in PUT /v1/campaigns/{id} so Apple clears any previous TargetCpa instead of retaining it via partial object merge.

    Receipt verification normalizes decimal money amounts (for example "4.00" versus Apple's readback "4") and null-reset fields in operations_verify. The build baseline is Go 1.26.10, including the pinned Docker builder, to incorporate standard-library security fixes. Tool names remain unchanged. See docs/MIGRATION-v0.3.8.md for compatibility details.
  footer: |
    Archives include SHA-256 checksums and SPDX SBOMs. See the README for installation, Apple Ads onboarding, safety controls, and known platform behavior.

    This project is independent and is not affiliated with, endorsed by, or sponsored by Apple Inc.
