version: 2

builds:
  - id: apple-ads-mcp
    main: ./cmd/apple-ads-mcp
    binary: apple-ads-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/zelentsov-dev/apple-ads-mcp/internal/mcpserver.Version={{.Version}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}_{{ .Version }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - accounts.example.json
      - .mcp.json
      - .codex-plugin/plugin.json
      - skills/apple-ads-operator/**
      - docs/MIGRATION-*.md
      - docs/ROADMAP.md
      - api-contract/**

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  name_template: "{{ .Tag }}"
  mode: replace
  make_latest: true
  header: |
    Apple Ads MCP {{ .Tag }} honors Apple rate-limit headers and Retry-After without shortening the required wait. Concurrent reads share a bounded per-profile cooldown; writes blocked before dispatch are distinguished from ambiguous writes and are never automatically retried.

    Bid strategies now validate the matching type and goal, creation versus update rules, account currency, placement, and parent campaign state. Explicit strategy requests do not require optimizer history minimums; conservative optimizer thresholds remain intact. Preview warnings persist with their receipt.

    Reports reject the retired storefront grouping with a countryOrRegion migration hint and preserve date strings. CPA cap remains available for compatibility, with deprecation annotations and warnings. Tool names remain unchanged. See docs/MIGRATION-v0.3.7.md for compatibility details.

    The build baseline is Go 1.26.9, including the pinned Docker builder, to incorporate standard-library security fixes.

    Validation uses synthetic data and cross-platform CI. This release does not claim live mutation acceptance and does not change advertising campaigns.
  footer: |
    Archives include SHA-256 checksums and SPDX SBOMs. See the README for installation, Apple Ads onboarding, safety controls, and known platform behavior.

    This project is independent and is not affiliated with, endorsed by, or sponsored by Apple Inc.
