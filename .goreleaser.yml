version: 2

builds:
  - id: apple-ads-mcp
    main: ./cmd/apple-ads-mcp
    binary: apple-ads-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/zelentsov-dev/apple-ads-mcp/internal/mcpserver.Version={{.Version}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}_{{ .Version }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - accounts.example.json
      - .mcp.json
      - .codex-plugin/plugin.json
      - skills/apple-ads-operator/**
      - docs/**
      - api-contract/**

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  name_template: "{{ .Tag }}"
  mode: replace
  make_latest: true
  header: |
    Apple Ads MCP {{ .Tag }} adds typed, actionable diagnostics across text and structured MCP results. Apple `4xx` details are bounded and sanitized, write gates explain how to opt in safely, and receipt failures now distinguish expired, used, missing, drifted, transport, and ambiguous outcomes.

    Targeting-keyword bulk creation now supports zero-based integer correlation IDs and one aggregate receipt across one or more ad groups. Successful item IDs are preserved and verified directly, partial Apple failures remain visible, and semantic object, inventory, relationship, and cascade reservations prevent overlapping mutations from dispatching against stale state.

    Read tools keep compatible legacy inputs while adding named ID aliases, typed query shortcuts, stricter keyword scopes, zero-metric reports, bounded change-history windows, compact locale output, exact Unicode owned-app fallback, and section-level opportunity diagnostics. Impression-share Apple errors remain honest upstream failures, and empty Search Results ad inventories are explained without synthesizing objects.

    Tool names remain stable. Existing `id`, advanced `filters`, and top-level keyword bulk `adGroupId` inputs remain supported. See `docs/MIGRATION-v0.3.6.md` for the complete compatibility and migration contract.
  footer: |
    Archives include SHA-256 checksums and SPDX SBOMs. See the README for installation, Apple Ads onboarding, safety controls, and known platform behavior.

    This project is independent and is not affiliated with, endorsed by, or sponsored by Apple Inc.
