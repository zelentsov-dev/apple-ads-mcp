version: 2

builds:
  - id: apple-ads-mcp
    main: ./cmd/apple-ads-mcp
    binary: apple-ads-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/zelentsov-dev/apple-ads-mcp/internal/mcpserver.Version={{.Version}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - accounts.example.json
      - .mcp.json
      - .codex-plugin/plugin.json
      - skills/apple-ads-operator/**
      - docs/**
      - api-contract/**

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  name_template: "{{ .Tag }}"
  mode: replace
  make_latest: true
  header: |
    Apple Ads MCP {{ .Tag }} adds on-demand optimization and separately gated lifecycle management to the local-first App Store campaign operator built on Apple Ads Platform API v1.

    Named learning and active policies produce bounded 28-day baselines and composite plans without a scheduler. Typed LOC shared-budget workflows keep billing PII local. Irreversible lifecycle operations require separate server, profile, session, expected-text, cascade, receipt, and verification gates. The server remains read-only by default and never exposes a raw HTTP passthrough.

    Full regression preserves the v0.2.1 read and operator contract. PAUSED live acceptance verifies new v0.3 behavior only against operator-controlled fixtures; mature business campaigns are read-only. Known upstream errors from phrase/category suggestions and impression share remain visible as structured Apple errors and are not reported as successful responses.
  footer: |
    Archives include SHA-256 checksums and SPDX SBOMs. See the README for installation, Apple Ads onboarding, safety controls, and known platform behavior.

    This project is independent and is not affiliated with, endorsed by, or sponsored by Apple Inc.
